(function () {
  "use strict";
  var DATA = JSON.parse(document.getElementById("quiz-data").textContent);
  var DIM_W = 4.0, THEME_BONUS = 1.4, THEME_MISS = 0.5;
  var MIN_Q = 5, MAX_Q = 8, STOP_P = 0.6;

  var songs = DATA.songs;
  var ids = songs.map(function (s) { return s.id; });
  var byId = {}; songs.forEach(function (s) { byId[s.id] = s; });
  var questions = DATA.questions;
  var qById = {}; questions.forEach(function (q) { qById[q.id] = q; });

  function answerScore(s, ans) {
    var sc = 0, d;
    var dims = ans.dims || {};
    for (d in dims) sc -= DIM_W * Math.pow(s.v[d] - dims[d], 2);
    var has = function (list) { return (list || []).some(function (t) { return s.tags.indexOf(t) >= 0; }); };
    if (ans.themes && ans.themes.length) sc += has(ans.themes) ? THEME_BONUS : -THEME_MISS;
    if (has(ans.themes_not)) sc -= THEME_BONUS;
    return sc;
  }
  function posterior(logs) {
    var m = -Infinity, k, z = 0, out = {};
    for (k in logs) m = Math.max(m, logs[k]);
    for (k in logs) { out[k] = Math.exp(logs[k] - m); z += out[k]; }
    for (k in out) out[k] /= z;
    return out;
  }
  function entropy(p) { var h = 0, k; for (k in p) if (p[k] > 0) h -= p[k] * Math.log(p[k]); return h; }
  function pChooseA(s, q) { return 1 / (1 + Math.exp(-2.5 * (answerScore(s, q.a) - answerScore(s, q.b)))); }
  function addAnswer(logs, ans) { var out = {}; ids.forEach(function (id) { out[id] = logs[id] + answerScore(byId[id], ans); }); return out; }
  function bestQuestion(logs, asked) {
    var post = posterior(logs), best = null, bestH = Infinity;
    questions.forEach(function (q) {
      if (asked.indexOf(q.id) >= 0) return;
      var pa = 0; ids.forEach(function (id) { pa += post[id] * pChooseA(byId[id], q); });
      var h = 0;
      if (pa > 1e-6) h += pa * entropy(posterior(addAnswer(logs, q.a)));
      if (1 - pa > 1e-6) h += (1 - pa) * entropy(posterior(addAnswer(logs, q.b)));
      if (h < bestH) { bestH = h; best = q.id; }
    });
    return best;
  }
  function ranked(logs) { var p = posterior(logs); return ids.slice().sort(function (a, b) { return p[b] - p[a]; }).map(function (id) { return { id: id, p: p[id] }; }); }

  // expose the engine for testing outside the browser
  if (typeof window.__edaQuizTest === "function") { window.__edaQuizTest({ answerScore: answerScore, bestQuestion: bestQuestion, ranked: ranked, addAnswer: addAnswer, pChooseA: pChooseA, posterior: posterior, ids: ids, byId: byId, qById: qById, MIN_Q: MIN_Q, MAX_Q: MAX_Q, STOP_P: STOP_P }); return; }

  // ---------- UI ----------
  var $ = function (id) { return document.getElementById(id); };
  var state;
  function show(view) { ["start", "quiz", "result"].forEach(function (v) { $(v).hidden = v !== view; }); window.scrollTo(0, 0); }
  function reset() { state = { logs: {}, asked: [], trail: [] }; ids.forEach(function (id) { state.logs[id] = 0; }); }

  function ask() {
    var qid = bestQuestion(state.logs, state.asked);
    state.current = qid;
    var q = qById[qid], n = state.asked.length + 1;
    $("qtext").textContent = q.text;
    $("ansA").lastChild.textContent = q.a.label;
    $("ansB").lastChild.textContent = q.b.label;
    $("qcount").textContent = "Spørsmål " + n;
    var bars = "";
    for (var i = 0; i < MAX_Q; i++) bars += '<span class="' + (i < n ? "on" : "") + '"></span>';
    $("progress").innerHTML = bars;
    show("quiz");
    $("ansA").focus({ preventScroll: true });
  }
  function answer(which) {
    var q = qById[state.current], ans = q[which];
    state.asked.push(q.id);
    state.trail.push({ q: q.text, a: ans.label });
    state.logs = addAnswer(state.logs, ans);
    var top = ranked(state.logs)[0];
    if (state.asked.length >= MAX_Q || (state.asked.length >= MIN_Q && top.p >= STOP_P)) finish();
    else ask();
  }
  function finish() {
    var r = ranked(state.logs);
    renderResult(r[0].id, r[1].id, state.trail);
    try { history.replaceState(null, "", "#" + r[0].id); } catch (e) { location.hash = r[0].id; }
  }
  function meter(label, value, left, right) {
    var pct = Math.round(Math.max(0, Math.min(1, value)) * 100);
    return '<div class="meter"><span>' + label + '</span><div class="bar" role="img" aria-label="' + label + ": " + pct + ' av 100"><i style="width:' + pct + '%"></i></div><div class="ends"><span>' + left + "</span><span>" + right + "</span></div></div>";
  }
  function renderResult(id, runnerId, trail) {
    var s = byId[id];
    $("rTitle").textContent = s.title;
    $("rFeat").textContent = s.feat ? "feat. " + s.feat : "E.D.A";
    $("rWhy").textContent = s.why;
    $("rSpotify").href = "https://open.spotify.com/track/" + s.spotify;
    $("rPlayer").src = "https://open.spotify.com/embed/track/" + s.spotify + "?utm_source=generator&theme=0";
    $("rMeters").innerHTML =
      meter("Lyd", s.v.energy, "rolig", "full guffe") +
      meter("Tekst", s.v.mood, "trist", "glad") +
      meter("Fest", s.v.party, "sofa", "klubb");
    $("rFacts").innerHTML = "<span><b>" + s.bpm + "</b> BPM</span><span>" + s.themes.slice(0, 3).join(" · ") + "</span>";
    if (runnerId) {
      var r = byId[runnerId];
      $("rRunner").innerHTML = '<span class="small">Nesten like bra:</span><a href="https://open.spotify.com/track/' + r.spotify + '" target="_blank" rel="noopener">' + r.title + "</a>";
    } else $("rRunner").innerHTML = "";
    $("rTrailBox").hidden = !trail || !trail.length;
    $("rTrail").innerHTML = (trail || []).map(function (t) { return "<span>" + t.q + " <b>" + t.a + "</b></span>"; }).join("");
    show("result");
  }

  $("go").addEventListener("click", function () { reset(); ask(); });
  $("random").addEventListener("click", function () {
    var pick = ids[Math.floor(Math.random() * ids.length)];
    var others = ids.filter(function (id) { return id !== pick; });
    var runner = others[Math.floor(Math.random() * others.length)];
    renderResult(pick, runner, null);
    try { history.replaceState(null, "", "#" + pick); } catch (e) { location.hash = pick; }
  });
  $("ansA").addEventListener("click", function () { answer("a"); });
  $("ansB").addEventListener("click", function () { answer("b"); });
  $("again").addEventListener("click", function () { try { history.replaceState(null, "", location.pathname); } catch (e) {} reset(); ask(); });
  $("restart1").addEventListener("click", function () { reset(); show("start"); });

  // shared link: #<song-id> opens that result directly
  function fromHash() {
    var h = (location.hash || "").slice(1);
    if (byId[h]) {
      var alt = ranked((function () { var l = {}; ids.forEach(function (id) { l[id] = -Math.pow(byId[id].v.energy - byId[h].v.energy, 2) - Math.pow(byId[id].v.mood - byId[h].v.mood, 2) - (id === h ? 9 : 0); }); return l; })())[0].id;
      renderResult(h, alt, null);
    }
  }
  window.addEventListener("hashchange", fromHash);
  reset();
  fromHash();
})();
</script>

</body>
</html>
